<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2026년 8월 판매조건 가이드 [카마스터]</title>
<!-- v2: 고객 제안서 + 판촉지원금 추가 -->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#eef0f3;color:#1a1a2e;padding-bottom:72px}
:root{--navy:#002c5f;--blue:#0d4a8a;--sky:#00aad2;--green:#16a34a;--green-bg:#dcfce7;--amber:#d97706;--amber-bg:#fef3c7;--red:#dc2626;--red-bg:#fee2e2;--purple:#7c3aed;--gray:#6b7280;--border:#e5e7eb;--card:#fff;--shadow:0 2px 8px rgba(0,44,95,.1)}

/* HEADER */
.hdr{background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hdr-logo{font-weight:800;font-size:1rem;letter-spacing:-.3px}
.hdr-badge{background:var(--sky);color:#fff;padding:3px 10px;border-radius:20px;font-size:.78rem;font-weight:700;margin-left:8px}
.hdr-btn{background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;padding:4px 6px}

/* CATEGORY TABS */
.cat-wrap{background:var(--navy);padding:0 8px 8px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.cat-wrap::-webkit-scrollbar{display:none}
.cat-btn{flex:0 0 auto;background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);border:none;border-radius:20px;padding:6px 13px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.cat-btn.on{background:var(--sky);color:#fff}

/* PAGES */
.page{display:none;padding:10px}.page.on{display:block}

/* VEHICLE GRID */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
@media(min-width:540px){.vgrid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:768px){.vgrid{grid-template-columns:repeat(5,1fr)}}
.vcard{background:var(--card);border-radius:12px;padding:11px 7px;text-align:center;cursor:pointer;border:2px solid transparent;box-shadow:var(--shadow);position:relative;transition:transform .15s}
.vcard:active{transform:scale(.95)}
.vcard.sel{border-color:var(--sky);background:#e8f6fb}
.vcard-name{font-weight:700;font-size:.88rem;color:var(--navy);line-height:1.2;margin-bottom:3px}
.vcard-sub{font-size:.75rem;color:var(--gray)}
.vcard-hl{font-size:.75rem;font-weight:700;color:var(--green);margin-top:2px}
.vcard-hl.none{color:#bbb}
.badge{position:absolute;top:4px;right:4px;font-size:.65rem;font-weight:800;padding:1px 5px;border-radius:8px;color:#fff}
.badge.new{background:var(--purple)}
.badge.up{background:var(--green)}
.badge.dn{background:var(--red)}

/* DETAIL PANEL */
.dpanel{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-top:8px}
.dpanel-hdr{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:13px 16px}
.dpanel-name{font-size:1.15rem;font-weight:800;margin-bottom:2px}
.dpanel-sub{font-size:.75rem;opacity:.8}
.dpanel-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:.7rem;font-weight:700}
.tag-green{background:rgba(22,163,74,.25);color:#a7f3d0}
.tag-amber{background:rgba(217,119,6,.25);color:#fcd34d}
.tag-blue{background:rgba(255,255,255,.2);color:#fff}

/* SECTIONS */
.sec{border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:none}
.sec-hdr{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;user-select:none}
.sec-ico{font-size:1rem;width:22px;text-align:center}
.sec-title{font-weight:700;font-size:.92rem;color:var(--navy);flex:1}
.sec-sum{font-size:.8rem;font-weight:700;color:var(--green)}
.sec-sum.none{color:#bbb}
.sec-sum.info{color:var(--sky)}
.chev{color:#bbb;font-size:.8rem;transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.sec-body{padding:0 16px 14px;display:none}
.sec-body.open{display:block}

/* MONTH TABLE */
.mtbl{width:100%;border-collapse:separate;border-spacing:3px;margin-top:6px}
.mtbl th{background:#f3f4f6;color:var(--gray);font-size:.75rem;font-weight:600;padding:5px 2px;border-radius:6px;text-align:center}
.mtbl td{text-align:center;padding:7px 3px;border-radius:8px;font-size:.8rem;font-weight:700}
.mc-has{background:var(--green-bg);color:var(--green)}
.mc-none{background:#f3f4f6;color:#bbb}
.mc-hot{background:#fee2e2;color:var(--red)}
.mc-blue{background:#dbeafe;color:#1d4ed8}
.mc-new{background:#f0fdf4;color:var(--green);outline:2px solid var(--green)}

/* INFO ROWS */
.irow{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid #f3f4f6}
.irow:last-child{border-bottom:none}
.ilbl{font-size:.82rem;color:var(--gray);font-weight:600;min-width:82px;padding-top:1px}
.ival{font-size:.88rem;color:#1a1a2e;font-weight:500;flex:1;line-height:1.5}
.ival.g{color:var(--green);font-weight:700}
.ival.b{color:#1d4ed8;font-weight:600}
.ival.a{color:var(--amber);font-weight:600}

/* TARGET ITEMS */
.titem{background:#f9fafb;border-radius:10px;padding:10px 12px;margin-bottom:6px;border-left:3px solid var(--sky)}
.titem-name{font-weight:700;font-size:.9rem;color:var(--navy);margin-bottom:4px}
.titem-amt{display:inline-block;background:var(--green);color:#fff;padding:2px 9px;border-radius:10px;font-size:.8rem;font-weight:700;margin-bottom:5px}
.titem-cond{font-size:.8rem;color:var(--gray);line-height:1.6;white-space:pre-line}

/* FINANCE */
.fbox{background:#f0f9ff;border-radius:10px;padding:10px 12px;margin-bottom:6px}
.fbox-title{font-size:.82rem;color:#0369a1;font-weight:700;margin-bottom:3px}
.fbox-rate{font-size:.88rem;color:#1e40af;font-weight:600;line-height:1.6}
.fbox-promo{background:#fffbeb;border-radius:10px;padding:10px 12px;margin-bottom:6px;border-left:3px solid var(--amber)}
.fbox-promo-title{font-size:.82rem;color:var(--amber);font-weight:700;margin-bottom:3px}
.fbox-promo-txt{font-size:.85rem;color:#92400e;line-height:1.6;white-space:pre-line}

/* NOTICE */
.nbox{background:var(--amber-bg);border-radius:8px;padding:8px 12px;margin-top:6px;font-size:.8rem;color:#92400e;line-height:1.6;white-space:pre-line}

/* BLUE MEMBERS */
.bm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
.bm-cell{background:#eef2ff;border-radius:8px;padding:7px 4px;text-align:center}
.bm-turn{font-size:.65rem;color:#6366f1;font-weight:700}
.bm-amt{font-size:.82rem;color:#3730a3;font-weight:800}

/* GENESIS STOCK */
.gstock{display:flex;gap:6px;margin-top:6px}
.gstock-cell{flex:1;text-align:center;padding:10px 6px;border-radius:10px}
.gstock-pre{background:#fee2e2;color:var(--red)}
.gstock-jul{background:#fef3c7;color:var(--amber)}
.gstock-label{font-size:.67rem;font-weight:600;margin-bottom:3px}
.gstock-amt{font-size:1.1rem;font-weight:900}

/* EV SPECIAL */
.ev-box{background:linear-gradient(135deg,#065f46,#047857);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;text-align:center}
.ev-box-label{font-size:.75rem;opacity:.85;margin-bottom:3px}
.ev-box-amt{font-size:1.5rem;font-weight:900}
.ev-box-note{font-size:.7rem;opacity:.8;margin-top:3px}

/* HOME PAGE */
.hcard{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.hcard-title{font-weight:800;font-size:1rem;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--sky);padding-bottom:8px}
.hrow{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.hrow:last-child{border-bottom:none}
.hveh{font-weight:700;font-size:.88rem;color:var(--navy);min-width:88px}
.hcond{font-size:.85rem;color:#374151;flex:1;line-height:1.5}
.chg-badge{display:inline-block;font-size:.68rem;font-weight:800;padding:1px 5px;border-radius:6px;color:#fff;margin-left:3px}
.chg-new{background:var(--purple)}
.chg-up{background:var(--green)}
.chg-dn{background:var(--red)}

/* TARGET PAGE */
.tcat{font-weight:800;font-size:.95rem;color:var(--navy);margin:14px 0 6px;padding-left:4px;border-left:3px solid var(--sky)}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:200;box-shadow:0 -2px 8px rgba(0,0,0,.07)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:none;border:none;cursor:pointer;color:#9ca3af;font-size:.68rem;font-weight:600;font-family:inherit}
.bnav-btn.on{color:var(--sky)}
.bnav-ico{font-size:1.3rem}

/* SEARCH */
.soverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300}
.soverlay.open{display:block}
.sbox{background:#fff;padding:14px}
.sinput{width:100%;padding:10px 16px;border:2px solid var(--sky);border-radius:24px;font-size:.95rem;outline:none;font-family:inherit}
.sresults{margin-top:8px;max-height:65vh;overflow-y:auto}
.sitem{padding:11px 4px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.sitem:active{background:#f0f9ff}
.sitem-name{font-weight:700;font-size:.95rem}
.sitem-cat{font-size:.78rem;color:var(--gray)}
.sitem-hl{font-size:.8rem;color:var(--green);font-weight:600;text-align:right}

/* VARIANT TABS */
.vtabs{display:flex;gap:5px;padding:8px 16px;background:#f9fafb;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.vtabs::-webkit-scrollbar{display:none}
.vtab{flex:0 0 auto;padding:5px 11px;border-radius:16px;font-size:.76rem;font-weight:600;border:1.5px solid var(--border);background:#fff;color:#4b5563;cursor:pointer;font-family:inherit}
.vtab.on{background:var(--sky);color:#fff;border-color:var(--sky)}

.section-divider{height:6px;background:#f3f4f6;margin:0 -16px}

/* ===== 납기 섹션 ===== */
.delivery-wrap{padding:4px 0}
.delivery-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid #f3f4f6}
.delivery-row:last-child{border-bottom:none}
.delivery-type{font-size:.8rem;color:#374151;font-weight:600;min-width:110px;line-height:1.4}
.delivery-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:.82rem;font-weight:800;white-space:nowrap}
.d-instant{background:#dcfce7;color:#15803d}
.d-1m{background:#d1fae5;color:#166534}
.d-1h{background:#fef9c3;color:#854d0e}
.d-2m{background:#fef3c7;color:#92400e}
.d-3m{background:#ffedd5;color:#9a3412}
.d-4m{background:#fee2e2;color:#991b1b}
.d-none{background:#f3f4f6;color:#6b7280}
.delivery-stock{display:inline-block;background:#dbeafe;color:#1e40af;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:4px;white-space:nowrap}
.delivery-note{font-size:.75rem;color:#6b7280;line-height:1.5;margin-top:3px}
.delivery-notice{background:#fef3c7;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:.75rem;color:#92400e;line-height:1.6}

/* ===== 고객 제안서 ===== */
.prop-wrap{padding:10px}
.prop-step{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.prop-step-title{font-weight:800;font-size:.9rem;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--sky);color:#fff;border-radius:50%;font-size:.72rem;font-weight:800;flex-shrink:0}
.prop-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f3f4f6}
.prop-row:last-child{border-bottom:none}
.prop-lbl{font-size:.78rem;color:var(--gray);font-weight:600;min-width:80px}
.prop-sel{flex:1;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.82rem;font-family:inherit;color:#1a1a2e;background:#fff}
.prop-sel:focus{border-color:var(--sky);outline:none}
.prop-check-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
@media(min-width:480px){.prop-check-grid{grid-template-columns:1fr 1fr 1fr}}
.prop-check{display:flex;align-items:center;gap:6px;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:.78rem;font-weight:600;color:#4b5563;background:#fff;user-select:none}
.prop-check.on{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.prop-check input{display:none}
.prop-generate{width:100%;padding:14px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px;letter-spacing:-.3px}
.prop-generate:active{opacity:.85}

/* 제안서 결과 */
.result-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,44,95,.15);margin-top:12px;padding-top:28px}
.result-hdr{background:linear-gradient(135deg,var(--navy),#1a4a8a);color:#fff;padding:18px 20px;text-align:center}
.result-hdr-month{font-size:.75rem;opacity:.8;margin-bottom:4px}
.result-hdr-model{font-size:1.5rem;font-weight:900;margin-bottom:4px}
.result-hdr-sub{font-size:.78rem;opacity:.8}
.result-total{background:linear-gradient(135deg,#065f46,#047857);color:#fff;padding:16px 20px;text-align:center}
.result-total-label{font-size:.78rem;opacity:.85;margin-bottom:4px}
.result-total-amount{font-size:2.2rem;font-weight:900;line-height:1}
.result-total-sub{font-size:.72rem;opacity:.8;margin-top:4px}
.result-breakdown{padding:14px 18px}
.result-item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f3f4f6}
.result-item:last-child{border-bottom:none}
.result-item-name{font-size:.82rem;color:#374151;font-weight:500}
.result-item-name .ri{font-size:.9rem;margin-right:4px}
.result-item-amt{font-size:.9rem;font-weight:800;color:var(--green)}
.result-finance{background:#f0f9ff;border-radius:10px;padding:12px 14px;margin:0 18px 14px}
.result-finance-title{font-size:.75rem;color:#0369a1;font-weight:700;margin-bottom:5px}
.result-finance-body{font-size:.8rem;color:#1e40af;font-weight:600;line-height:1.7;white-space:pre-line}
.result-notice{background:#fef3c7;margin:0 18px 16px;border-radius:8px;padding:10px 12px;font-size:.72rem;color:#92400e;line-height:1.6}
.result-price-box{background:#f8fafc;border-top:1px solid #e5e7eb;padding:12px 18px}
.result-price-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.result-price-row+.result-price-row{border-top:1px dashed #e5e7eb}
.result-price-lbl{font-size:.78rem;color:#6b7280;font-weight:500}
.result-price-val{font-size:.85rem;font-weight:700;color:var(--navy)}
.result-price-final{background:var(--navy);color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center}
.result-price-final-lbl{font-size:.8rem;opacity:.85}
.result-price-final-val{font-size:1.15rem;font-weight:900}
.pp-trim-box{width:100%;background:#f8fafc;border-radius:8px;padding:8px 10px;margin-top:4px}
.pp-trim-label{font-size:.72rem;color:var(--gray);font-weight:700;margin-bottom:6px}
.pp-trim-grid{display:flex;flex-direction:column;gap:5px;width:100%}
.pp-trim-btn{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-family:inherit;text-align:left;width:100%;transition:all .15s}
.pp-trim-btn.on{border-color:var(--sky);background:#e0f7fb}
.pp-trim-nm{font-size:.82rem;font-weight:600;color:#374151}
.pp-trim-pr{font-size:.85rem;font-weight:800;color:var(--navy)}
.pp-trim-btn.on .pp-trim-nm{color:var(--sky)}
.pp-trim-btn.on .pp-trim-pr{color:var(--sky)}
.pp-trim-note{font-size:.68rem;color:var(--amber);font-weight:600;margin-top:6px}
.result-section{padding:10px 18px;border-bottom:1px solid #f3f4f6}
.result-section-title{font-size:.75rem;font-weight:800;color:var(--gray);margin-bottom:6px}
.result-calc-box{background:linear-gradient(135deg,var(--navy),#1a4a8a);color:#fff;padding:14px 18px}
.result-calc-row{display:flex;justify-content:space-between;font-size:.82rem;padding:3px 0;opacity:.85}
.result-calc-total{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:900;padding:8px 0 2px;border-top:1px solid rgba(255,255,255,.3);margin-top:4px}
.result-calc-note{font-size:.68rem;opacity:.7;margin-top:4px}
.result-closing{background:#f8fafc;padding:12px 18px;border-top:1px solid #e5e7eb;font-size:.75rem;color:#374151;line-height:1.8}
.result-closing-main{font-weight:700;color:var(--navy);margin-bottom:4px}
.result-closing-sub{color:var(--gray);font-size:.7rem}
.pp-trim-row{display:flex;justify-content:space-between;padding:3px 0;font-size:.78rem}
.pp-trim-row+.pp-trim-row{border-top:1px solid #f3f4f6}
.pp-trim-grp{font-size:.68rem;color:var(--gray);font-weight:600;padding:4px 0 1px;margin-top:2px}
.result-btn-row{display:flex;gap:8px;padding:0 18px 16px}
.result-btn{flex:1;padding:11px;border-radius:10px;font-size:.82rem;font-weight:700;border:none;cursor:pointer;font-family:inherit}
.result-btn-print{background:var(--navy);color:#fff}
.result-btn-reset{background:#f3f4f6;color:#374151}

/* ===== 판촉지원금 (카마스터 전용) ===== */
.pin-overlay{display:none;position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),#0d4a8a);z-index:400;flex-direction:column;align-items:center;justify-content:center}
.pin-overlay.open{display:flex}
.pin-box{width:300px;max-width:90vw;text-align:center}
.pin-logo{font-size:2.5rem;margin-bottom:8px}
.pin-title{color:#fff;font-size:1.1rem;font-weight:800;margin-bottom:4px}
.pin-sub{color:rgba(255,255,255,.7);font-size:.78rem;margin-bottom:24px}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:20px}
.pin-dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .2s}
.pin-dot.filled{background:#fff}
.pin-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-key{padding:14px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:12px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s}
.pin-key:active{background:rgba(255,255,255,.35)}
.pin-err{color:#fca5a5;font-size:.8rem;margin-top:8px;min-height:20px}
.pin-close{position:absolute;top:16px;right:16px;background:none;border:none;color:rgba(255,255,255,.6);font-size:1.5rem;cursor:pointer}

/* 판촉지원금 페이지 */
.inc-section{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.inc-title{font-weight:800;font-size:.95rem;color:var(--navy);padding-bottom:8px;margin-bottom:10px;border-bottom:2px solid var(--red);display:flex;align-items:center;gap:6px}
.inc-table{width:100%;border-collapse:collapse;font-size:.78rem}
.inc-table{width:100%;border-collapse:collapse;font-size:.82rem}
.inc-table th{background:#f8fafc;color:var(--navy);font-weight:700;padding:9px 7px;text-align:left;border-bottom:2px solid var(--border)}
.inc-table td{padding:9px 7px;border-bottom:1px solid #f3f4f6;vertical-align:top;line-height:1.6}
.inc-table tr:last-child td{border-bottom:none}
.inc-amt{font-weight:800;color:var(--red);white-space:nowrap}
.inc-period{display:inline-block;background:#fee2e2;color:var(--red);padding:1px 6px;border-radius:6px;font-size:.72rem;font-weight:700;margin-bottom:2px}
.inc-note{font-size:.75rem;color:var(--gray);margin-top:2px}
.inc-alert{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:.78rem;color:#991b1b;font-weight:600;display:flex;align-items:center;gap:6px}
.pin-change-row{display:flex;align-items:center;gap:8px;padding:10px 0}
.pin-change-input{flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;font-family:inherit}
.pin-change-btn{padding:8px 14px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit}
.hdr-slogan{text-align:center;font-size:14px;opacity:.75;letter-spacing:.3px;padding:3px 0 1px;color:#fff}
.upd-bar{background:#fffbeb;border-bottom:1px solid #f59e0b;padding:6px 14px;display:flex;align-items:center;gap:8px;font-size:.76rem}
.upd-bar-date{color:#92400e;font-weight:800;white-space:nowrap;flex-shrink:0}
.upd-bar-txt{color:#78350f;flex:1;line-height:1.5}
.upd-bar-close{background:none;border:none;color:#b45309;font-size:1.1rem;cursor:pointer;padding:0 2px;flex-shrink:0;line-height:1}

/* PRICE PANEL */
.price-btn{background:#e6f7fb;color:var(--sky);border:1.5px solid var(--sky);border-radius:20px;padding:5px 14px;font-size:.76rem;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;line-height:1;transition:background .15s,color .15s}
.price-btn.on{background:var(--sky);color:#fff}
.dpanel-conds{}
.vtabs-wrap{display:flex;align-items:center;background:#f9fafb;border-bottom:1px solid var(--border)}
.vtabs-wrap>.vtabs{flex:1;border-bottom:none;background:none}
.vtab-btn-wrap{padding:6px 12px;flex-shrink:0}
.price-body{padding:14px 16px 6px}
.price-hdr{font-weight:800;font-size:.9rem;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.pg-sep{font-size:.78rem;font-weight:800;color:tomato;margin:12px 0 5px;padding-left:2px;letter-spacing:-.2px}
.pg-sep:first-child{margin-top:0}
.ptbl{width:100%;border-collapse:collapse;margin-bottom:4px}
.ptbl th{text-align:left;padding:5px 8px;font-size:.72rem;color:var(--gray);font-weight:600;border-bottom:2px solid var(--border)}
.ptbl th:last-child{text-align:right}
.ptbl td{padding:7px 8px;font-size:.85rem;border-bottom:1px solid #f3f4f6}
.ptbl td:last-child{text-align:right;font-weight:700;color:var(--navy);white-space:nowrap}
.ptbl tr:last-child td{border-bottom:none}
.opt-sep{font-size:.78rem;font-weight:700;color:var(--gray);margin:12px 0 6px;padding-left:2px}
.opt-grid{display:flex;flex-wrap:wrap;gap:5px}
.opt-chip{background:#f3f4f6;border-radius:20px;padding:5px 11px;font-size:.77rem;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.opt-chip-nm{color:#374151;font-weight:500}
.opt-chip-pr{color:var(--sky);font-weight:800;white-space:nowrap}
.price-foot{font-size:.7rem;color:#9ca3af;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);line-height:1.6}
.no-price-msg{padding:20px;text-align:center;color:var(--gray);font-size:.84rem}

/* PASSWORD SCREEN */
.pw-overlay{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:20px}
.pw-box{background:#fff;border-radius:16px;padding:36px 40px;width:300px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.pw-logo{font-size:2rem;margin-bottom:4px}
.pw-title{font-size:1rem;font-weight:800;color:var(--navy);margin-bottom:4px}
.pw-sub{font-size:.75rem;color:var(--gray);margin-bottom:24px}
.pw-input{width:100%;border:2px solid var(--border);border-radius:10px;padding:12px;font-size:1.2rem;text-align:center;letter-spacing:8px;outline:none;font-family:inherit;color:var(--navy);font-weight:700;box-sizing:border-box}
.pw-input:focus{border-color:var(--sky)}
.pw-btn{width:100%;margin-top:12px;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:12px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit}
.pw-btn:active{opacity:.85}
.pw-err{color:#dc2626;font-size:.8rem;margin-top:8px;min-height:18px}
.pw-badge{font-size:.72rem;color:#9ca3af;margin-top:16px}

/* ===== 자동차세 섹션 ===== */
function buildTaxSection(v){
  var data = CAR_TAX[v.id];
  if(!data || !data.length) return '';
  var rows = '';
  for(var i=0;i<data.length;i++){
    var d=data[i];
    rows += '<div class="irow">'
      +'<span class="ilbl" style="min-width:120px">'+d.l+'</span>'
      +'<span style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;flex:1">'
      +'<span style="font-size:.8rem;color:#374151;background:#f3f4f6;padding:2px 8px;border-radius:10px">'+d.cc+'</span>'
      +'<span class="ival g" style="font-size:.9rem">'+d.tax+'</span>'
      +'</span>'
      +'</div>';
  }
  rows += '<div class="nbox" style="margin-top:6px">※ 비영업용 기준 / 지방교육세 포함 / 신차 1년차 세액\n※ 지차체 30% 감면 적용 시 실납부세액 추가 감소</div>';
  return buildSection('\uD83D\uDCB0 연간 자동차세 (비영업용 기준)', data[0].tax, 'info', rows, false);
}

/* ===== RENDER VEHICLE LIST ===== */
function renderVehicleList(cat){
  const list = VEHICLES[cat];
  if(!list) return '';
  return `<div class="vgrid">${list.map(v=>`
    <div class="vcard" id="vc-${v.id}" onclick="selectVehicle('${cat}','${v.id}')">
      ${v.change?`<span class="badge ${v.change.type}">${v.change.type==='new'?'신규':v.change.type==='up'?'↑강화':'↓변경'}</span>`:''}
      <div class="vcard-name">${v.name}</div>
      ${v.sub?`<div class="vcard-sub">${v.sub}</div>`:''}
      <div class="vcard-hl ${v.hl?'':'none'}">${v.hl||'조건없음'}</div>
    </div>`).join('')}</div>
  <div id="detail-${cat}"></div>`;
}

/* ===== RENDER DETAIL ===== */
function selectVehicle(cat, id){
  document.querySelectorAll('.vcard').forEach(c=>c.classList.remove('sel'));
  const card = document.getElementById('vc-'+id);
  if(card) card.classList.add('sel');
  const v = VEHICLES[cat].find(x=>x.id===id);
  if(!v) return;
  selectedVehicle = v;
  const variants = v.variants || Object.keys(v.summerFesta||{});
  selectedVariant = variants[0];
  const el = document.getElementById('detail-'+cat);
  el.innerHTML = buildDetail(v, selectedVariant);
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function buildVariantTabs(v){
  const variants = v.variants || Object.keys(v.summerFesta||{});
  if(variants.length<=1) return '';
  return `<div class="vtabs">${variants.map(va=>`
    <button class="vtab ${va===selectedVariant?'on':''}" onclick="changeVariant('${va}')">${va}</button>
  `).join('')}</div>`;
}

function changeVariant(va){
  selectedVariant = va;
  const v = selectedVehicle;
  const cat = Object.keys(VEHICLES).find(c=>VEHICLES[c].some(x=>x.id===v.id));
  const el = document.getElementById('detail-'+cat);
  el.innerHTML = buildDetail(v, va);
}

function buildDeliverySummary(dlv){
  const best = dlv.find(r=>r.stock)||dlv[0];
  if(!best) return '확인 필요';
  const stockTxt = best.stock?` (재고 ${best.stock.replace(/[^0-9,대]/g,'').trim()})` : '';
  return best.delivery + stockTxt;
}
function buildDeliveryBody(dlv){
  let h = '<div class="delivery-wrap">';
  for(const r of dlv){
    const cls = dlvClass(r.d);
    const icon = r.d==='instant'?'🟢':r.d==='1m'?'🟩':r.d==='1hm'?'🟡':r.d==='2m'?'🟠':r.d==='3m'||r.d==='4m'||r.d==='6m'?'🔴':'⚪';
    h += `<div class="delivery-row">
      <div class="delivery-type">${r.type}</div>
      <div>
        <span class="delivery-badge ${cls}">${icon} ${r.delivery}</span>
        ${r.stock?`<span class="delivery-stock">📦 ${r.stock} (8월 1일 기준)</span>`:''}
        ${r.note?`<div class="delivery-note">※ ${r.note}</div>`:''}
      </div>
    </div>`;
  }
  h += `</div><div class="delivery-notice">
    ※ 재고 수량은 <b>8월 1일 기준</b>이며 실시간 변동됩니다 — 배정요청 전 재고 확인 필수<br>
    ※ 납기는 배정요청 시점 기준이며 생산 상황에 따라 변동 가능 — 고객 안내 필수<br>
    ※ 공장 하기휴무 (8/3~8/7) · 아산공장 라인합리화 공사 (7/25~8/17) 반영된 납기<br>
    ※ '즉시' 납기 차종 중 재고 미보유 사양은 신규 생산 시 2~3주 예상
  </div>`;
  return h;
}

function buildSummerFesta(sf){
  const months = Object.keys(sf);
  if(months.length===0) return '<div style="color:#bbb;font-size:.82rem;padding:6px 0">해당 없음</div>';
  let rows = '<table class="mtbl"><tr><th>생산월</th><th>조건</th></tr>';
  const allMonths = ['3월이전','4월이전','4월','5월','6월','7월'];
  for(const m of allMonths){
    if(!(m in sf)) continue;
    const val = sf[m];
    const cls = !val?'mc-none':val.includes('400만')||val.includes('300만')||val.includes('250만')?'mc-hot':val.includes('★신규')?'mc-new':'mc-has';
    rows += `<tr><td class="mc-none" style="text-align:left;padding-left:8px;font-size:.73rem;color:var(--gray)">${m}</td><td class="${cls}">${val||'–'}</td></tr>`;
  }
  rows += '</table>';
  return rows;
}

function buildFinance(v){
  let h = '';
  if(v.finance){
    h += `<div class="fbox"><div class="fbox-title">모빌리티 할부 (표준형)</div><div class="fbox-rate">${v.finance}</div></div>`;
  }
  if(v.financePromo){
    h += `<div class="fbox-promo"><div class="fbox-promo-title">💡 프로모션 금리</div><div class="fbox-promo-txt">${v.financePromo}</div></div>`;

  h += '<div class="nbox">※ 모빌리티 할부: 선수금 전액 현대카드 결제 (차량가 1% 이상 必)</div>';
  return h;
}

function buildSection(title, summary, sumClass, bodyHtml, defaultOpen){
  const id = 'sec-'+Math.random().toString(36).slice(2);
  return `<div class="sec">
    <div class="sec-hdr" onclick="toggleSec('${id}')">
      <span class="sec-title">${title}</span>
      <span class="sec-sum ${sumClass||''}">${summary}</span>
      <span class="chev ${defaultOpen?'open':''}" id="${id}-chev">▼</span>
    </div>
    <div class="sec-body ${defaultOpen?'open':''}" id="${id}">${bodyHtml}</div>
  </div>`;
}

function toggleSec(id){
  const body = document.getElementById(id);
  const chev = document.getElementById(id+'-chev');
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

function buildPricePanel(vid, variant){
  var d = PRICE_DATA[vid];
  if(!d) return '<div class="no-price-msg">📋 가격표 데이터가 없습니다</div>';
  var vdata = d[variant] || d['\uc77c\ubc18'] || d[Object.keys(d)[0]];
  if(!vdata) return '<div class="no-price-msg">📋 해당 트림 가격 정보가 없습니다</div>';
  var html = '<div class="price-hdr">📋 트림별 기본가격</div>';
  for(var gi=0;gi<vdata.g.length;gi++){
    var gr=vdata.g[gi];
    if(gr.l) html += '<div class="pg-sep">\u25b8 '+gr.l+'</div>';
    html += '<table class="ptbl"><tr><th>트림</th><th>기본가격</th></tr>';
    for(var ti=0;ti<gr.t.length;ti++){
      var nm=gr.t[ti][0], pr=gr.t[ti][1];
      html += '<tr><td>'+nm+'</td><td>'+pr.toLocaleString()+'만원</td></tr>';
    }
    html += '</table>';
  }
  if(vdata.o && vdata.o.length){
    html += '<div class="opt-sep">📦 주요 옵션 (선택사양)</div><div class="opt-grid">';
    for(var oi=0;oi<vdata.o.length;oi++){
      var optNm=vdata.o[oi][0], optPr=vdata.o[oi][1];
      html += '<div class="opt-chip"><span class="opt-chip-nm">'+optNm+'</span><span class="opt-chip-pr">'+optPr+'만</span></div>';
    }
    html += '</div>';
  }
  html += '<div class="price-foot">* 기본가격 기준 · 부가세 포함 · 정부 보조금 미적용 · 실제 가격은 옵션·지역·시기에 따라 다를 수 있음</div>';
  return html;
}

function togglePriceView(vid){
  const panel = document.getElementById('dpanel-'+vid);
  if(!panel) return;
  const btn = panel.querySelector('.price-btn');
  const priceBody = panel.querySelector('.price-body');
  const conds = panel.querySelector('.dpanel-conds');
  const isOpen = priceBody && priceBody.style.display !== 'none';
  if(conds) conds.style.display = isOpen ? '' : 'none';
  if(priceBody) priceBody.style.display = isOpen ? 'none' : 'block';
  if(btn){ btn.textContent = isOpen ? '간단 가격표' : '← 판매조건'; btn.classList.toggle('on', !isOpen); }
}


/* ===== RENDER TARGETS PAGE ===== */
function renderTargets(){
  const el = document.getElementById('pg-targets');
  const cats = {};
  Object.entries(TARGETS).forEach(([id,t])=>{
    if(!cats[t.cat]) cats[t.cat]=[];
    cats[t.cat].push({id,...t});
  });
  let html = '';
  for(const [cat, items] of Object.entries(cats)){
    html += `<div class="tcat">${cat}</div>`;
    for(const t of items){
      const amt = t.amt||(t.amounts?t.amounts.map(a=>`${a.v}: 당사 ${a.c}${a.o?' / 타사 '+a.o:''}`).join('\n'):'');
      html += `<div class="titem">
        <div class="titem-name">${t.name}</div>
        ${amt?`<span class="titem-amt">${amt.split('\n')[0]}</span>`:''}
        ${t.vehicles?`<div style="font-size:.72rem;color:#374151;margin:3px 0">📌 ${t.vehicles}</div>`:''}
        <div class="titem-cond">${t.cond||''}</div>
      </div>`;
    }
  }
  el.innerHTML = html;
}

/* ===== SEARCH ===== */
function openSearch(){
  document.getElementById('soverlay').classList.add('open');
  setTimeout(()=>document.getElementById('sinput').focus(),100);
}
function closeSearch(){document.getElementById('soverlay').classList.remove('open')}
function doSearch(){
  const q = document.getElementById('sinput').value.trim();
  const out = document.getElementById('sresults');
  if(!q){out.innerHTML='';return;}
  const results = [];
  const catNames = {ice:'국내승용',ev:'EV/수소',genesis:'제네시스',truck:'상용/트럭',taxi:'영업용'};
  for(const [cat,list] of Object.entries(VEHICLES)){
    for(const v of list){
      if(v.name.includes(q)||(v.sub||'').includes(q)){
        results.push({cat,v});
      }
    }
  }
  if(!results.length){out.innerHTML='<div style="padding:12px;color:#999;text-align:center">검색 결과 없음</div>';return;}
  out.innerHTML = results.map(({cat,v})=>`
    <div class="sitem" onclick="gotoVehicle('${cat}','${v.id}')">
      <div><div class="sitem-name">${v.name}${v.sub?' ('+v.sub+')':''}</div><div class="sitem-cat">${catNames[cat]}</div></div>
      <div class="sitem-hl">${v.hl||'—'}</div>
    </div>`).join('');
}
function gotoVehicle(cat,id){
  closeSearch();
  switchTab(cat);
  setTimeout(()=>selectVehicle(cat,id),100);
}

function ppShowTrims(vid){
  var box = document.getElementById('pp-trims');
  if(!box) return;
  var pd = PRICE_DATA[vid];
  window._selTrimPrice = null; window._selTrimName = null; window._selVariant = null;
  if(!pd){ box.innerHTML='<div style="font-size:.75rem;color:var(--gray)">가격표 정보 없음</div>'; return; }
  var h='<div class="pp-trim-label">\u25b8 기본가격 기준 \u00b7 트림 선택</div><div class="pp-trim-grid">';
  var first=true;
  var vkeys=Object.keys(pd);
  for(var vi=0;vi<vkeys.length;vi++){
    var vk=vkeys[vi], vdata=pd[vk];
    if(!vdata||!vdata.g) continue;
    for(var gi=0;gi<vdata.g.length;gi++){
      var gr=vdata.g[gi];
      if(gr.l) h+='<div class="pp-trim-grp" style="margin-top:4px">'+gr.l+'</div>';
      for(var ti=0;ti<gr.t.length;ti++){
        var nm=gr.t[ti][0], pr=gr.t[ti][1];
        if(first){ window._selTrimPrice=pr; window._selTrimName=nm; window._selVariant=vk; first=false; }
        h+='<button class="pp-trim-btn'+(window._selTrimName===nm?' on':'')+'" onclick="ppSelectTrim(this,'+pr+',\''+nm.replace(/'/g,"\\'")+'\',\''+vk.replace(/'/g,"\\'")+'\')">'+
           '<span class="pp-trim-nm">'+nm+'</span>'+
           '<span class="pp-trim-pr">'+pr.toLocaleString()+'\ub9cc\uc6d0</span></button>';
      }
    }
  }
  h+='</div><div class="pp-trim-note">\u203b \uc635\uc158 \uc120\ud0dd \uc2dc \ucd94\uac00 \uae08\uc561 \ubc1c\uc0dd</div>';
  box.innerHTML=h;
}

/* ===== 취득세 추정 함수 ===== */
// 취득세기준표 (비영업용, 2026년 기준)
// 일반승용 7% / 경차(1000cc이하) 4% / 화물차 5% / 승합차 5% / 영업용 4%
function getAcqTax(vid, priceWon){
  var light = ['casper','casper-ev'];
  var truck = ['porter-lp','porter-ev','mighty','pavise','st1'];
  var van   = ['solati','county'];
  var taxi  = ['sonata-tx','grandeur-tx','ioniq5-tx','ioniq6-tx','staria-ev-tx'];
  var ev    = ['kona-ev','ioniq5','ioniq6','ioniq9','staria-ev','nexo',
               'g80ev','gv60','gv70ev','porter-ev','st1'];

  var rate, label, evExempt = 0;
  if(light.indexOf(vid) >= 0)     { rate=0.04; label='경차 4%'; }
  else if(truck.indexOf(vid) >= 0){ rate=0.05; label='화물차 5%'; }
  else if(van.indexOf(vid) >= 0)  { rate=0.05; label='승합차 5%'; }
  else if(taxi.indexOf(vid) >= 0) { rate=0.04; label='영업용 4%'; }
  else {
    rate=0.07; label='일반 승용차 7%';
    if(ev.indexOf(vid) >= 0) evExempt = 140;  // 전기/수소 최대 140만원 감면
  }

  var taxBase = Math.round(priceWon / 1.1 * 10) / 10;   // 과세표준 만원 (VAT 제외)
  var taxAmt  = Math.round(taxBase * rate * 10) / 10;    // 취득세 만원
  var taxNet  = evExempt > 0 ? Math.max(0, taxAmt - evExempt) : taxAmt;

  return { rate:rate, label:label, taxBase:taxBase, taxAmt:taxAmt, taxNet:taxNet, evExempt:evExempt };
}

function resetProposal(){ renderProposal(); }
function generateProposal(){
  const vid = getActiveVid();
  if(!vid){ alert('차종을 선택하세요'); return; }
  const v = getVehicle(vid);
  if(!v){ alert('차종 정보 오류'); return; }

  const parse = s => { const m=String(s||0).match(/(\d+)/); return m?parseInt(m[1]):0; };
  const g = id => document.getElementById(id);
  const chked = id => { const el=g(id); return el&&el.checked; };
  const val = id => { const el=g(id); return el?el.value:''; };

  // 선택 트림 가격
  const trimPrice = window._selTrimPrice || null;
  const trimName  = window._selTrimName  || null;

  // ── 생산월/재고 조건 (별도 구분) ──
  let sfItem = null, sfAmt = 0;
  const monthVal = val('pp-month');
  if(monthVal){
    if(monthVal.startsWith('pre6-')||monthVal.startsWith('jul-')){
      const pct = monthVal.split('-')[1];
      sfItem = {icon:'📦', name:'제네시스 재고 할인', val:pct+' 할인', isPct:true};
    } else {
      const sf = v.summerFesta;
      const sfKeys = sf ? Object.keys(sf) : [];
      const sfData = sfKeys.length>0 ? sf[sfKeys[0]] : null;
      const amt = sfData ? sfData[monthVal] : null;
      if(amt){
        const mainAmt = amt.replace(/\s*\([^)]*\)/g,'').trim();
        const subNote = amt.match(/\(([^)]*)\)/)?.[1]||'';
        sfAmt = parse(amt);
        sfItem = {icon:'🌟', name:'생산월 조건 ('+monthVal+' 생산)'+(subNote?' *'+subNote:''), val:mainAmt+'원'};
      }
    }
  }
  if(chked('pp-ioniq')&&v.ioniq100k){
    if(!sfItem){ sfAmt=parse(v.ioniq100k); sfItem={icon:'🎉',name:'아이오닉 100만대 기념',val:v.ioniq100k}; }
  }

  // ── 타겟 할인 항목 ──
  const targetItems = []; let targetTotal = 0;
  if(chked('pp-tradein')){
    const tiMap={'corp-ice':'50만','corp-ev':'100만','corp-genesis':'200만','corp-truck':'100만','other-ice':'30만','other-ev':'50만','other-genesis':'100만'};
    const tiLbl={'corp-ice':'당사 내연','corp-ev':'당사 EV','corp-genesis':'당사 제네시스/넥쏘','corp-truck':'당사 1톤화물','other-ice':'타사 내연','other-ev':'타사 EV','other-genesis':'타사 제네시스'};
    const tv=val('pp-titype'); const ta=tiMap[tv]||''; const tl=tiLbl[tv]||tv;
    if(ta){ targetItems.push({icon:'🔄',name:'트레이드인 ('+tl+')',val:ta+'원'}); targetTotal+=parse(ta); }
    if(chked('pp-oldcar')){ targetItems.push({icon:'🚗',name:'노후차 추가',val:'20만원'}); targetTotal+=20; }
  }
  if(chked('pp-rentcar')){
    const ra=parseInt(val('pp-rentamt'))||10;
    targetItems.push({icon:'🏢',name:'현장렌트사 우대',val:ra+'만원'}); targetTotal+=ra;
  }
  if(chked('pp-benefia')){ targetItems.push({icon:'🎁',name:'베네피아 제휴',val:'20만원'}); targetTotal+=20; }
  if(chked('pp-gfnew')){ targetItems.push({icon:'👥',name:'굿프렌드 (신규가망)',val:'15만원'}); targetTotal+=15; }
  if(chked('pp-gfexist')){ targetItems.push({icon:'🔁',name:'굿프렌드 (기출고전담)',val:'10만원'}); targetTotal+=10; }
  if(chked('pp-company')){
    const cmMap={'corp-20':'20만','ceo-50':'50만','keyman-30':'30만','corp-50':'50만','ceo-100':'100만','keyman-50':'50만'};
    const cv=val('pp-cmtype'); const ca=cmMap[cv]||'';
    if(ca){ targetItems.push({icon:'🏛',name:'현장관리법인',val:ca+'원'}); targetTotal+=parse(ca); }
  }
  if(chked('pp-special')){
    const specAmtMap={palisade:50,'porter-lp':40,santafe:5,avante:20,venue:20,kona:20,'kona-ev':20};
    const specNm=g('pp-special-desc'); const sa=specAmtMap[vid]||0;
    if(sa){ targetItems.push({icon:'⭐',name:specNm?specNm.textContent:'차종특화',val:sa+'만원'}); targetTotal+=sa; }
  }
  if(v.evBenefit){ targetItems.push({icon:'⚡',name:'EV 구매혜택',val:v.evBenefit,noSum:true}); }

  const totalDiscount = sfAmt + targetTotal;
  const hasPct = sfItem && sfItem.isPct;

function ppFinanceChange(finV){
  const wrap = document.getElementById('pp-calc-wrap');
  const std  = document.getElementById('pp-std-calc');
  const bal  = document.getElementById('pp-bal-calc');
  if(!wrap) return;
  if(finV==='standard'||finV==='promo'){
    wrap.style.display=''; std.style.display=''; bal.style.display='none';

    wrap.style.display=''; std.style.display='none'; bal.style.display='';
  } else {
    wrap.style.display='none';
  }

function ppCalcStd(){
  const p = getNum('pp-std-principal');  // 만원
  const annualRate = parseFloat(document.getElementById('pp-std-rate')?.value)||0.054;
  const n = parseInt(document.getElementById('pp-std-term')?.value)||36;
  const el = document.getElementById('pp-std-result');
  if(!el) return;
  if(p<=0){ el.style.display='none'; return; }

  const r = annualRate/12;
  const monthly = r===0 ? p/n : p * r * Math.pow(1+r,n) / (Math.pow(1+r,n)-1);
  const mRounded = Math.round(monthly*10)/10;
  const totalInterest = Math.round((mRounded*n - p)*10)/10;

  el.style.display='block';
  el.innerHTML =
    '<div style="font-size:.75rem;opacity:.8;margin-bottom:4px">월납입금 (표준형)</div>' +
    '<div style="font-size:1.9rem;font-weight:900">' + Math.floor(monthly*10000).toLocaleString('ko-KR') + '<span style="font-size:1rem">원/월</span></div>' +
    '<div style="font-size:.72rem;opacity:.75;margin-top:5px">' +
    '할부원금 ' + (p*10000).toLocaleString() + '원 / ' + n + '개월 / 총이자 ' + (Math.floor(monthly*10000)*n - p*10000).toLocaleString() + '원</div>';
}

function ppCalcBal(){
  const normalP = getNum('pp-bal-normal');  // 만원
  const flexP   = getNum('pp-bal-flex');    // 만원
  const annualRate = parseFloat(document.getElementById('pp-bal-rate')?.value)||0.028;
  const n = parseInt(document.getElementById('pp-bal-term')?.value)||36;
  const el = document.getElementById('pp-bal-result');
  if(!el) return;
  if(normalP<=0 && flexP<=0){ el.style.display='none'; return; }

  const r = annualRate/12;
  const normalMonthly = normalP<=0 ? 0 :
    r===0 ? normalP/n : normalP * r * Math.pow(1+r,n) / (Math.pow(1+r,n)-1);
  const flexInterest = flexP * r;
  const total = Math.round((normalMonthly + flexInterest)*10)/10;
  const nm = Math.round(normalMonthly*10)/10;
  const fi = Math.round(flexInterest*10)/10;

  el.style.display='block';
  el.innerHTML =
    '<div style="font-size:.75rem;opacity:.8;margin-bottom:6px">★ 월납입금 합계 (① + ②)</div>' +
    '<div style="font-size:1.9rem;font-weight:900">' + Math.floor(total*10000).toLocaleString('ko-KR') + '<span style="font-size:1rem">원/월</span></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px">' +
    '<div style="background:rgba(59,130,246,.25);border-radius:8px;padding:8px;text-align:center">' +
    '<div style="font-size:.65rem;opacity:.8">① 원리금균등</div>' +
    '<div style="font-size:1rem;font-weight:800">' + Math.floor(nm*10000).toLocaleString('ko-KR') + '원</div>' +
    '<div style="font-size:.62rem;opacity:.65">원금 ' + (normalP*10000).toLocaleString() + '원</div></div>' +
    '<div style="background:rgba(34,197,94,.25);border-radius:8px;padding:8px;text-align:center">' +
    '<div style="font-size:.65rem;opacity:.8">② 유예금 이자</div>' +
    '<div style="font-size:1rem;font-weight:800">' + Math.floor(fi*10000).toLocaleString('ko-KR') + '원</div>' +
    '<div style="font-size:.62rem;opacity:.65">유예금 ' + (flexP*10000).toLocaleString() + '원</div></div>' +
    '</div>';
}

/* ===== 판촉지원금 (PIN 잠금) ===== */
let pinBuf = '';
const DEFAULT_PIN = '1234';
function getPin(){ return localStorage.getItem('cm_pin')||DEFAULT_PIN; }

function openIncentive(){
  if(sessionStorage.getItem('pin_ok')==='1'){ switchTab('incentive'); return; }
  pinBuf=''; updatePinDots();
  document.getElementById('pinErr').textContent='';
  document.getElementById('pinOverlay').classList.add('open');
}
function closePinOverlay(){ document.getElementById('pinOverlay').classList.remove('open'); }
function pinInput(d){
  if(d==='X'){pinBuf='';updatePinDots();return;}
  if(pinBuf.length>=4) return;
  pinBuf+=d; updatePinDots();
  if(pinBuf.length===4){
    if(pinBuf===getPin()){
      sessionStorage.setItem('pin_ok','1');
      closePinOverlay();
      switchTab('incentive');
    } else {
      document.getElementById('pinErr').textContent='PIN이 맞지 않습니다';
      setTimeout(()=>{pinBuf='';updatePinDots();document.getElementById('pinErr').textContent='';},800);
    }
  }
}
function pinClear(){ if(pinBuf.length>0) pinBuf=pinBuf.slice(0,-1); updatePinDots(); }
function updatePinDots(){
  for(let i=0;i<4;i++){
    document.getElementById('pd'+i).classList.toggle('filled',i<pinBuf.length);
  }
}

function changePin(){
  const np=document.getElementById('newPin').value;
  if(np.length!==4||!/^\d{4}$/.test(np)){alert('4자리 숫자를 입력하세요');return;}
  localStorage.setItem('cm_pin',np);
  alert('PIN이 변경되었습니다.');
  document.getElementById('newPin').value='';
}

function fmtNum(el){
  // 커서 위치 보존하며 천단위 콤마 적용
  const pos = el.selectionStart;
  const raw = el.value.replace(/,/g,'').replace(/[^0-9]/g,'');
  const formatted = raw ? parseInt(raw).toLocaleString('ko-KR') : '';
  el.value = formatted;
  // 콤마 추가로 길이 변할 수 있으므로 커서 끝에 위치
  try{ el.setSelectionRange(formatted.length, formatted.length); }catch(e){}
}
function getNum(id){ return parseInt((document.getElementById(id)?.value||'0').replace(/,/g,'').replace(/[^0-9]/g,''))||0; }

function calcMonthly(){
  const annualRate = parseFloat(document.getElementById('c-rate')?.value)||0.054;
  const term = parseInt(document.getElementById('c-term')?.value)||36;
  const r = annualRate/12;

  // 할부원금 직접 입력 여부 확인
  const directPrincipal = getNum('c-principal');
  const modeLabel = document.getElementById('c-mode-label');

  let principal, down, detailExtra;

  if(directPrincipal > 0){
    // ▶ 직접 입력 모드: 할부원금 그대로 사용
    principal = directPrincipal;
    down = 0;
    detailExtra = '';
    if(modeLabel) modeLabel.innerHTML = '<span style="color:var(--green);font-weight:700">✅ 할부원금 직접 입력 모드</span>';
  } else {
    // ▶ 자동계산 모드: 차량가 - 할인 - 보조금 - 선수금
    const price = getNum('c-price');
    const dc    = getNum('c-dc');
    const sub   = getNum('c-sub');
    const downRate = parseFloat(document.getElementById('c-down')?.value)||0.01;
    const netPrice = price - dc - sub;
    if(netPrice <= 0){ document.getElementById('c-monthly').textContent='-'; return; }
    down = Math.round(netPrice * downRate);
    principal = netPrice - down;
    detailExtra = `선수금 ${down.toLocaleString()}원 / `;
    if(modeLabel) modeLabel.innerHTML = '<span style="color:#9ca3af">자동계산 모드 (할부원금 직접 입력 시 우선 적용)</span>';
  }

  if(principal <= 0){ document.getElementById('c-monthly').textContent='-'; return; }

  const monthly = r===0 ? Math.round(principal/term) : Math.round(principal * r * Math.pow(1+r,term) / (Math.pow(1+r,term)-1));
  const totalInterest = monthly*term - principal;

  document.getElementById('c-monthly').textContent = monthly.toLocaleString()+'원';
  document.getElementById('c-detail').innerHTML =
    `할부원금 ${principal.toLocaleString()}원 / ${detailExtra}월 ${term}회<br>`+
    `총 이자 ${totalInterest.toLocaleString()}원 / 총 납입 ${(monthly*term+down).toLocaleString()}원`;
}

function calcUyeage(){
  const normalPrincipal = getNum('u-normal');  // ① 원리금균등 상환 원금
  const flexPrincipal   = getNum('u-flex');    // ② 유예금
  const annualRate = parseFloat(document.getElementById('u-rate')?.value)||0.028;
  const term       = parseInt(document.getElementById('u-term')?.value)||36;
  const el = document.getElementById('uyeage-result');
  if(!el) return;

  if(normalPrincipal<=0 && flexPrincipal<=0){
    el.innerHTML='<div style="color:#bbb;text-align:center;padding:16px">금액을 입력하세요</div>';
    return;
  }

  const r = annualRate/12;

  // ① 정상할부 월납입금 — 원리금균등상환
  const normalMonthly = normalPrincipal<=0 ? 0
    : r===0 ? Math.round(normalPrincipal/term)
    : Math.round(normalPrincipal * r * Math.pow(1+r,term) / (Math.pow(1+r,term)-1));

  // ② 유예금 월이자 — 잔액에 대한 이자만 납입
  const flexInterest = Math.round(flexPrincipal * r);

  // ★ 월납입금 합계
  const totalMonthly = normalMonthly + flexInterest;

  const normalTotalInterest = normalMonthly*term - normalPrincipal;

  el.innerHTML = `
    <!-- 월납입금 합계 결과 -->
    <div style="background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:12px;padding:16px;margin-top:10px;margin-bottom:8px">
      <div style="font-size:.75rem;opacity:.8;margin-bottom:6px">★ 월납입금 합계 (① + ②)</div>
      <div style="font-size:2.2rem;font-weight:900;margin-bottom:10px">${totalMonthly.toLocaleString()}<span style="font-size:1rem">원/월</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <!-- ① 정상할부 -->
        <div style="background:rgba(59,130,246,.25);border-radius:10px;padding:10px;text-align:center">
          <div style="font-size:.68rem;opacity:.8;margin-bottom:4px">① 정상할부</div>
          <div style="font-size:.68rem;opacity:.7;margin-bottom:2px">(원리금균등)</div>
          <div style="font-size:1.15rem;font-weight:900">${normalMonthly.toLocaleString()}원</div>
          <div style="font-size:.65rem;opacity:.65;margin-top:3px">원금 ${normalPrincipal.toLocaleString()}원</div>
        </div>
        <!-- ② 유예금 이자 -->
        <div style="background:rgba(34,197,94,.25);border-radius:10px;padding:10px;text-align:center">
          <div style="font-size:.68rem;opacity:.8;margin-bottom:4px">② 유예금 이자</div>
          <div style="font-size:.68rem;opacity:.7;margin-bottom:2px">(유예금 잔액 기준 매월)</div>
          <div style="font-size:1.15rem;font-weight:900">${flexInterest.toLocaleString()}원</div>
          <div style="font-size:.65rem;opacity:.65;margin-top:3px">잔액 ${flexPrincipal.toLocaleString()}원 × ${(annualRate*100).toFixed(2)}%÷12</div>
        </div>
      </div>
    </div>

    <!-- 상세 정보 -->
    <div style="background:#f8fafc;border-radius:10px;padding:12px 14px;font-size:.78rem;color:#374151;line-height:1.9">
      <div style="display:flex;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding-bottom:6px;margin-bottom:6px">
        <span>① 원리금균등 상환 원금</span>
        <b>${normalPrincipal.toLocaleString()}원</b>
      </div>
      <div style="display:flex;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding-bottom:6px;margin-bottom:6px">
        <span>① 총 이자 (${term}개월)</span>
        <b>${normalTotalInterest.toLocaleString()}원</b>
      </div>
      <div style="display:flex;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding-bottom:6px;margin-bottom:6px">
        <span>② 유예금 잔액</span>
        <b style="color:var(--green)">${flexPrincipal.toLocaleString()}원</b>
      </div>
      <div style="display:flex;justify-content:space-between">
        <span>② 유예금 전액상환 후 월납입금</span>
        <b style="color:var(--green)">${normalMonthly.toLocaleString()}원/월 <span style="font-size:.7rem;color:#9ca3af">(이자 절감)</span></b>
      </div>
    </div>
    <div style="font-size:.72rem;color:#9ca3af;margin-top:6px;line-height:1.6">
      ※ ② 유예금 잔액은 언제든 부분/전액 상환 가능 → 상환할수록 월이자 감소<br>
      ※ 유예금을 0 입력 시 일반 표준형 할부와 동일
    </div>`;
}

function switchTab(id){
  curCat = id;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('pg-'+id).classList.add('on');
  const catBtn = document.querySelector(`.cat-btn[data-id="${id}"]`);
  if(catBtn) catBtn.classList.add('on');
  const navIdx = TABS.find(t=>t.id===id)?.nav;
  if(navIdx>=0){
    document.querySelectorAll('.bnav-btn')[navIdx]?.classList.add('on');
  }
  // 특별 페이지 처리
  if(id==='proposal') renderProposal();
  if(id==='incentive') renderIncentivePage();
  if(id==='calc') renderCalc();
  if(id==='help') renderHelp();
  if(id==='catalog') renderCatalog();
}

/* ===== PNG 저장 (카카오톡 전송용 고화질) ===== */
async function saveAsPng(){
  if(typeof html2canvas==='undefined'){
    alert('이미지 라이브러리 로딩 중입니다. 잠시 후 다시 시도하세요.'); return;
  }
  const resultEl=document.getElementById('p-result');
  if(!resultEl||!resultEl.querySelector('.result-card')){
    alert('먼저 제안서를 생성하세요'); return;
  }
  const card=resultEl.querySelector('.result-card');
  const btn=document.querySelector('.result-btn-print');
  const origTxt=btn?btn.textContent:'';
  if(btn){btn.textContent='⏳ 생성 중...';btn.disabled=true;}
  // 원본 스타일 저장
  const origFs=document.documentElement.style.fontSize;
  const origW=card.style.width;
  const origMW=card.style.maxWidth;
  // PNG 캡처용: 18px 기준 · 420px 고정폭
  document.documentElement.style.fontSize='18px';
  card.style.width='420px';
  card.style.maxWidth='420px';
  await new Promise(r=>setTimeout(r,150));  // 렌더링 대기
  try{
    const canvas=await html2canvas(card,{
      scale:3,            // 3배 고해상도 (1260px 폭)
      useCORS:true,
      logging:false,
      backgroundColor:'#ffffff'
    });
    const a=document.createElement('a');
    a.download='현대자동차_구매혜택_제안서.png';
    a.href=canvas.toDataURL('image/png');
    a.click();
  }finally{
    // 원본 복원
    document.documentElement.style.fontSize=origFs;
    card.style.width=origW;
    card.style.maxWidth=origMW;
    if(btn){btn.textContent=origTxt;btn.disabled=false;}
  }
}

  ['ice','ev','genesis','truck','taxi'].forEach(cat=>{

  renderTargets();

}
